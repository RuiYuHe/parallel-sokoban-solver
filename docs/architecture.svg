<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1040" height="700" fill="#fff"/>
  <text x="520" y="30" text-anchor="middle" font-size="17" font-weight="bold">Batched A* search: serial frontier, parallel expansion</text>

  <rect x="330" y="55" width="380" height="70" rx="6" fill="#eee" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="82" text-anchor="middle" font-size="14" font-weight="bold">Global priority queue</text>
  <text x="520" y="103" text-anchor="middle" font-size="12">ordered by f = pushes + h</text>
  <text x="520" y="119" text-anchor="middle" font-size="11" fill="#666">owned by the main thread</text>

  <line x1="520" y1="125" x2="520" y2="170" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="148" font-size="12">1. pop up to 256 best nodes</text>

  <rect x="330" y="170" width="380" height="68" rx="6" fill="#e4e9f7" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="197" text-anchor="middle" font-size="14" font-weight="bold">current_batch[]</text>
  <text x="520" y="217" text-anchor="middle" font-size="12">prepared serially by main thread</text>

  <line x1="520" y1="238" x2="520" y2="282" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="260" font-size="12">2. #pragma omp parallel for schedule(dynamic)</text>

  <rect x="55" y="282" width="930" height="190" rx="8" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="76" y="307" font-size="12" font-style="italic" fill="#555">parallel phase — workers read shared maps and write only private buffers</text>

  <g font-size="12">
    <rect x="82" y="326" width="260" height="125" rx="6" fill="#f6f6f6" stroke="#333"/>
    <text x="212" y="348" text-anchor="middle" font-weight="bold">Worker 0</text>
    <text x="212" y="371" text-anchor="middle">staleness / goal check</text>
    <text x="212" y="390" text-anchor="middle">reachability + successors</text>
    <text x="212" y="409" text-anchor="middle">Hungarian h + cost_key</text>
    <text x="212" y="432" text-anchor="middle" fill="#555">→ thread_results[0], thread_goals[0]</text>

    <rect x="390" y="326" width="260" height="125" rx="6" fill="#f6f6f6" stroke="#333"/>
    <text x="520" y="348" text-anchor="middle" font-weight="bold">Worker 1</text>
    <text x="520" y="371" text-anchor="middle">staleness / goal check</text>
    <text x="520" y="390" text-anchor="middle">reachability + successors</text>
    <text x="520" y="409" text-anchor="middle">Hungarian h + cost_key</text>
    <text x="520" y="432" text-anchor="middle" fill="#555">→ private buffers</text>

    <rect x="698" y="326" width="260" height="125" rx="6" fill="#f6f6f6" stroke="#333"/>
    <text x="828" y="348" text-anchor="middle" font-weight="bold">Worker N (…)</text>
    <text x="828" y="371" text-anchor="middle">staleness / goal check</text>
    <text x="828" y="390" text-anchor="middle">reachability + successors</text>
    <text x="828" y="409" text-anchor="middle">Hungarian h + cost_key</text>
    <text x="828" y="432" text-anchor="middle" fill="#555">→ private buffers</text>
  </g>

  <line x1="520" y1="472" x2="520" y2="515" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="495" font-size="12">3. implicit barrier, then serial merge</text>

  <rect x="300" y="515" width="440" height="82" rx="6" fill="#e4e9f7" stroke="#333" stroke-width="1.5"/>
  <text x="520" y="541" text-anchor="middle" font-size="14" font-weight="bold">Main thread merge</text>
  <text x="520" y="562" text-anchor="middle" font-size="12">update cost_map, parent_map, frontier</text>
  <text x="520" y="580" text-anchor="middle" font-size="12">record best goal; stop only when min frontier f ≥ goal pushes</text>

  <path d="M740 556 L980 556 L980 90 L710 90" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1000" y="430" text-anchor="middle" font-size="12" transform="rotate(-90 1000 430)">repeat until optimality bound closes</text>

  <text x="520" y="650" text-anchor="middle" font-size="11" fill="#666">No frontier mutex or concurrent map is needed in the maintained version: shared-state mutation occurs only after the OpenMP region.</text>
</svg>
