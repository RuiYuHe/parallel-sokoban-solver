<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" viewBox="0 0 1020 560" font-family="Menlo, Consolas, monospace">
  <rect width="1020" height="560" fill="#fff"/>
  <text x="510" y="34" text-anchor="middle" font-size="17" font-weight="bold">Heuristic: exact minimum-cost box → target assignment</text>
  <text x="510" y="56" text-anchor="middle" font-size="12" fill="#555">cost matrix entries come from wall-aware BFS distances; Hungarian algorithm chooses the minimum perfect matching</text>

  <g font-size="14">
    <rect x="90" y="100" width="70" height="56" fill="#f0f0f0" stroke="#333"/>
    <rect x="160" y="100" width="100" height="56" fill="#f0f0f0" stroke="#333"/>
    <rect x="260" y="100" width="100" height="56" fill="#f0f0f0" stroke="#333"/>
    <rect x="360" y="100" width="100" height="56" fill="#f0f0f0" stroke="#333"/>
    <text x="210" y="134" text-anchor="middle" font-weight="bold">T1</text>
    <text x="310" y="134" text-anchor="middle" font-weight="bold">T2</text>
    <text x="410" y="134" text-anchor="middle" font-weight="bold">T3</text>

    <rect x="90" y="156" width="70" height="56" fill="#f0f0f0" stroke="#333"/>
    <text x="125" y="190" text-anchor="middle" font-weight="bold">B1</text>
    <rect x="160" y="156" width="100" height="56" fill="#e8f3e8" stroke="#2f7a2f" stroke-width="2"/>
    <text x="210" y="190" text-anchor="middle" font-weight="bold">4</text>
    <rect x="260" y="156" width="100" height="56" fill="#fff" stroke="#999"/>
    <text x="310" y="190" text-anchor="middle">7</text>
    <rect x="360" y="156" width="100" height="56" fill="#fff" stroke="#999"/>
    <text x="410" y="190" text-anchor="middle">9</text>

    <rect x="90" y="212" width="70" height="56" fill="#f0f0f0" stroke="#333"/>
    <text x="125" y="246" text-anchor="middle" font-weight="bold">B2</text>
    <rect x="160" y="212" width="100" height="56" fill="#fff" stroke="#999"/>
    <text x="210" y="246" text-anchor="middle">6</text>
    <rect x="260" y="212" width="100" height="56" fill="#e8f3e8" stroke="#2f7a2f" stroke-width="2"/>
    <text x="310" y="246" text-anchor="middle" font-weight="bold">3</text>
    <rect x="360" y="212" width="100" height="56" fill="#fff" stroke="#999"/>
    <text x="410" y="246" text-anchor="middle">5</text>

    <rect x="90" y="268" width="70" height="56" fill="#f0f0f0" stroke="#333"/>
    <text x="125" y="302" text-anchor="middle" font-weight="bold">B3</text>
    <rect x="160" y="268" width="100" height="56" fill="#fff" stroke="#999"/>
    <text x="210" y="302" text-anchor="middle">8</text>
    <rect x="260" y="268" width="100" height="56" fill="#fff" stroke="#999"/>
    <text x="310" y="302" text-anchor="middle">5</text>
    <rect x="360" y="268" width="100" height="56" fill="#e8f3e8" stroke="#2f7a2f" stroke-width="2"/>
    <text x="410" y="302" text-anchor="middle" font-weight="bold">2</text>
  </g>

  <rect x="90" y="365" width="370" height="52" rx="5" fill="#f6f6f6" stroke="#333"/>
  <text x="275" y="387" text-anchor="middle" font-size="12" fill="#555">minimum perfect matching</text>
  <text x="275" y="406" text-anchor="middle" font-size="14" font-weight="bold">h = 4 + 3 + 2 = 9</text>

  <g font-size="13" fill="#222">
    <text x="520" y="112" font-weight="bold" font-size="14">Why exact assignment matters</text>
    <text x="520" y="145">1. Build the full box × target distance matrix.</text>
    <text x="520" y="177">2. Hungarian algorithm finds the minimum-cost</text>
    <text x="540" y="196">one-to-one assignment across all boxes at once.</text>
    <text x="520" y="228">3. Each distance ignores other boxes and player</text>
    <text x="540" y="247">access, so it cannot exceed the true push cost</text>
    <text x="540" y="266">for that assignment.</text>
    <text x="520" y="298">4. Taking the minimum assignment therefore keeps</text>
    <text x="540" y="317">h admissible for push-count A*.</text>

    <line x1="520" y1="348" x2="940" y2="348" stroke="#ccc"/>
    <text x="520" y="378" font-weight="bold">What the heuristic still ignores</text>
    <text x="520" y="404">• other boxes blocking each other</text>
    <text x="520" y="428">• whether the player can reach the required push side</text>
    <text x="520" y="452">• future deadlocks beyond the precomputed dead squares</text>
    <text x="520" y="486" font-size="12" fill="#555">So h is a lower bound, not an exact Sokoban solution cost.</text>
  </g>

  <text x="510" y="530" text-anchor="middle" font-size="11" fill="#666">The graded submission used greedy matching; the maintained version replaces it with exact assignment to restore the lower-bound guarantee.</text>
</svg>
