<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" viewBox="0 0 1020 560" font-family="Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1020" height="560" fill="#ffffff"/>

  <text x="510" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Heuristic: greedy box → target assignment</text>
  <text x="510" y="54" text-anchor="middle" font-size="12" fill="#555">illustrative example — distances come from the precomputed true_distances table</text>

  <!-- Matrix grid -->
  <!-- geometry: grid_x0=90, grid_y0=110, col0 width=70 (row labels), col1-3 width=100 each, row_h=64 -->
  <g font-size="14">
    <!-- header row background -->
    <rect x="90" y="100" width="70" height="56" fill="#f0f0f0" stroke="#333" stroke-width="1.2"/>
    <rect x="160" y="100" width="100" height="56" fill="#f0f0f0" stroke="#333" stroke-width="1.2"/>
    <rect x="260" y="100" width="100" height="56" fill="#f0f0f0" stroke="#333" stroke-width="1.2"/>
    <rect x="360" y="100" width="100" height="56" fill="#f0f0f0" stroke="#333" stroke-width="1.2"/>
    <text x="210" y="134" text-anchor="middle" font-weight="bold">T1</text>
    <text x="310" y="134" text-anchor="middle" font-weight="bold">T2</text>
    <text x="410" y="134" text-anchor="middle" font-weight="bold">T3</text>

    <!-- row B1 -->
    <rect x="90" y="156" width="70" height="56" fill="#f0f0f0" stroke="#333" stroke-width="1.2"/>
    <text x="125" y="190" text-anchor="middle" font-weight="bold">B1</text>
    <rect x="160" y="156" width="100" height="56" fill="#dff3df" stroke="#2f7a2f" stroke-width="2"/>
    <text x="210" y="190" text-anchor="middle" fill="#1f5c1f" font-weight="bold">4</text>
    <circle cx="248" cy="168" r="12" fill="#2f7a2f"/>
    <text x="248" y="172" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text>
    <rect x="260" y="156" width="100" height="56" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <text x="310" y="190" text-anchor="middle" fill="#888">7</text>
    <rect x="360" y="156" width="100" height="56" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <text x="410" y="190" text-anchor="middle" fill="#888">9</text>

    <!-- row B2 -->
    <rect x="90" y="212" width="70" height="56" fill="#f0f0f0" stroke="#333" stroke-width="1.2"/>
    <text x="125" y="246" text-anchor="middle" font-weight="bold">B2</text>
    <rect x="160" y="212" width="100" height="56" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <text x="210" y="246" text-anchor="middle" fill="#888">6</text>
    <rect x="260" y="212" width="100" height="56" fill="#dff3df" stroke="#2f7a2f" stroke-width="2"/>
    <text x="310" y="246" text-anchor="middle" fill="#1f5c1f" font-weight="bold">3</text>
    <circle cx="348" cy="224" r="12" fill="#2f7a2f"/>
    <text x="348" y="228" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text>
    <rect x="360" y="212" width="100" height="56" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <text x="410" y="246" text-anchor="middle" fill="#888">5</text>

    <!-- row B3 -->
    <rect x="90" y="268" width="70" height="56" fill="#f0f0f0" stroke="#333" stroke-width="1.2"/>
    <text x="125" y="302" text-anchor="middle" font-weight="bold">B3</text>
    <rect x="160" y="268" width="100" height="56" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <text x="210" y="302" text-anchor="middle" fill="#888">8</text>
    <rect x="260" y="268" width="100" height="56" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <text x="310" y="302" text-anchor="middle" fill="#888">5</text>
    <rect x="360" y="268" width="100" height="56" fill="#dff3df" stroke="#2f7a2f" stroke-width="2"/>
    <text x="410" y="302" text-anchor="middle" fill="#1f5c1f" font-weight="bold">2</text>
    <circle cx="448" cy="280" r="12" fill="#2f7a2f"/>
    <text x="448" y="284" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text>
  </g>

  <text x="90" y="350" text-anchor="start" font-size="12" fill="#555">cell = true_distances[target][box]</text>
  <text x="90" y="366" text-anchor="start" font-size="12" fill="#555">green = chosen   gray = excluded</text>

  <!-- sum formula -->
  <rect x="90" y="374" width="370" height="46" rx="5" fill="#f6f6f6" stroke="#333" stroke-width="1.2"/>
  <text x="105" y="403" text-anchor="start" font-size="14" fill="#111">h = 2 + 3 + 4 = 9</text>

  <!-- right column: step narrative -->
  <g font-size="13" fill="#222">
    <text x="520" y="106" font-weight="bold" font-size="14">calculate_heuristic(), each iteration:</text>

    <circle cx="530" cy="140" r="11" fill="#2f7a2f"/>
    <text x="530" y="144" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text>
    <text x="552" y="136" text-anchor="start">scan every remaining (box, target)</text>
    <text x="552" y="153" text-anchor="start">pair still unassigned, take the</text>
    <text x="552" y="170" text-anchor="start">single smallest distance overall</text>

    <circle cx="530" cy="204" r="11" fill="#2f7a2f"/>
    <text x="530" y="208" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text>
    <text x="552" y="200" text-anchor="start">assign that box to that target,</text>
    <text x="552" y="217" text-anchor="start">then remove both from the pool</text>

    <circle cx="530" cy="251" r="11" fill="#2f7a2f"/>
    <text x="530" y="255" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">3</text>
    <text x="552" y="247" text-anchor="start">repeat until every box has a target;</text>
    <text x="552" y="264" text-anchor="start">h = sum of the chosen distances</text>

    <line x1="520" y1="292" x2="960" y2="292" stroke="#ccc" stroke-width="1"/>

    <text x="520" y="318" font-weight="bold" font-size="13" fill="#111">why not "each box picks its own nearest target"?</text>
    <text x="520" y="340" font-size="12">picking box-by-box can send two boxes toward the</text>
    <text x="520" y="357" font-size="12">same target. taking the single globally cheapest</text>
    <text x="520" y="374" font-size="12">remaining pair first (as above) never assigns a</text>
    <text x="520" y="391" font-size="12">target twice, at the cost of not always matching the</text>
    <text x="520" y="408" font-size="12">true minimum-cost assignment (that needs solving a</text>
    <text x="520" y="425" font-size="12">bipartite matching exactly, e.g. Hungarian algorithm) —</text>
    <text x="520" y="442" font-size="12">see Known rough edges in DESIGN.md.</text>
  </g>

  <text x="510" y="500" text-anchor="middle" font-size="12" fill="#666">dead squares (unreachable-by-pull-from-any-target) are pruned from the search before this step ever runs — see Design Notes.</text>
</svg>
